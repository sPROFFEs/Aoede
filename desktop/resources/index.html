<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aoede</title>
    <style>
        :root {
            --primary: #1ed760;
            --background: #0f1011;
            --surface: #151718;
            --border: #3a3d40;
            --text-main: #f5f7f8;
            --text-sub: #a7adb2;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: var(--background); color: var(--text-main); overflow: hidden; }
        
        #setup-view {
            display: none;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 16px 32px rgba(0,0,0,0.5);
            text-align: left;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span { color: var(--primary); }
        .sub { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.4; }
        label { display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-sub); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.05em; }
        input { width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; margin-bottom: 20px; transition: border 0.2s; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 13px; background: var(--primary); color: #000; font-weight: 700; border: none; border-radius: 999px; cursor: pointer; font-size: 0.95rem; transition: transform 0.1s, opacity 0.2s; }
        button:hover { opacity: 0.92; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div id="setup-view">
        <div class="card">
            <div class="logo">Aoede <span>Desktop</span></div>
            <div class="sub">Connect this standalone player window to your Aoede server.</div>
            <form id="setup-form">
                <label for="server-url">Aoede Server URL</label>
                <input type="url" id="server-url" placeholder="https://aoede.yourdomain.com" required autofocus>
                <button type="submit">Connect to Server</button>
                <p id="setup-error" role="alert" style="color:#ff8c8c;margin-top:16px" hidden></p>
            </form>
        </div>
    </div>

    <script src="js/neutralino.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
