<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aoede</title>
    <style>
        :root {
            --primary: #1ed760;
            --background: #0f1011;
            --surface: #151718;
            --border: #3a3d40;
            --text-main: #f5f7f8;
            --text-sub: #a7adb2;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: var(--background); color: var(--text-main); overflow: hidden; }
        
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        #setup-view {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 16px 32px rgba(0,0,0,0.5);
            text-align: left;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span { color: var(--primary); }
        .sub { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.4; }
        label { display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--text-sub); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.05em; }
        input { width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; margin-bottom: 20px; transition: border 0.2s; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 13px; background: var(--primary); color: #000; font-weight: 700; border: none; border-radius: 999px; cursor: pointer; font-size: 0.95rem; transition: transform 0.1s, opacity 0.2s; }
        button:hover { opacity: 0.92; }
        button:active { transform: scale(0.98); }

        #change-server-btn {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 9999;
            display: none;
        }
        #change-server-btn:hover { color: #fff; background: rgba(0,0,0,0.9); }
    </style>
</head>
<body>
    <div id="setup-view">
        <div class="card">
            <div class="logo">Aoede <span>Desktop</span></div>
            <div class="sub">Connect this standalone player window to your Aoede server.</div>
            <form id="setup-form">
                <label for="server-url">Aoede Server URL</label>
                <input type="url" id="server-url" placeholder="https://aoede.yourdomain.com" required autofocus>
                <button type="submit">Connect to Server</button>
            </form>
        </div>
    </div>

    <script src="js/neutralino.js"></script>
    <script>
        const STORAGE_KEY = 'aoede_server_url';
        const setupView = document.getElementById('setup-view');
        const setupForm = document.getElementById('setup-form');
        const serverInput = document.getElementById('server-url');

        async function initApp() {
            try {
                Neutralino.init();
            } catch (e) {
                console.warn('Running outside Neutralino runtime');
            }

            let savedUrl = null;
            try {
                savedUrl = await Neutralino.storage.getData(STORAGE_KEY);
            } catch (e) {
                savedUrl = localStorage.getItem(STORAGE_KEY);
            }

            if (savedUrl && savedUrl.trim()) {
                loadServer(savedUrl.trim());
            } else {
                showSetup();
            }
        }

        function showSetup() {
            setupView.style.display = 'flex';
            serverInput.focus();
        }

        function loadServer(url) {
            let formatted = url.trim();
            if (!formatted.startsWith('http://') && !formatted.startsWith('https://')) {
                formatted = 'https://' + formatted;
            }
            formatted = formatted.replace(/\/+$/, '');

            try {
                Neutralino.storage.setData(STORAGE_KEY, formatted);
            } catch(e) {}
            localStorage.setItem(STORAGE_KEY, formatted);

            // Direct top-level navigation instead of iframe
            window.location.replace(formatted);
        }

        setupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = serverInput.value;
            if (val) loadServer(val);
        });

        initApp();
    </script>
</body>
</html>
