name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to update with the IPA (e.g. v1.3.1)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS Archive
        run: |
          xcodebuild archive \
            -project ios/Aoede.xcodeproj \
            -scheme Aoede \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/build/Aoede.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: bash ios/scripts/package_ios.sh ios/build ios/dist

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoede-ios
          path: ios/dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aoede-ios
          path: artifacts

      - name: Upload iOS IPA to Release
        env:
          GH_TOKEN: ${{ github.token }}
          AOEDE_RELEASE_TAG: ${{ inputs.release_tag }}
          AOEDE_REPOSITORY: ${{ github.repository }}
        run: |
          gh release view "$AOEDE_RELEASE_TAG" --repo "$AOEDE_REPOSITORY"
          gh release upload "$AOEDE_RELEASE_TAG" artifacts/aoede-ios.ipa artifacts/aoede-ios.ipa.sha256 --clobber --repo "$AOEDE_REPOSITORY"
