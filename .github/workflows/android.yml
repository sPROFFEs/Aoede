name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'Aoede/assets/**'
      - 'Aoede/concierge/templates/**'
      - 'Aoede/concierge/locales/**'
      - 'scripts/package_android.py'
      - 'scripts/test_android.mjs'
      - '.github/workflows/android.yml'
  pull_request:
    paths: ['android/**', 'Aoede/assets/**', 'Aoede/concierge/templates/**', 'Aoede/concierge/locales/**', 'scripts/package_android.py', 'scripts/test_android.mjs', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to update after validation (empty builds only)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the frontend compiler
        run: python3 -m pip install 'Jinja2==3.1.6'
      - name: Test the multimedia bridge and party interruptions
        run: |
          node --experimental-vm-modules scripts/test_android.mjs
          node android/test_frontend.mjs
      - name: Test, lint and build Android
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Sign with the distribution key when configured
        id: signing
        env:
          AOEDE_ANDROID_KEYSTORE_BASE64: ${{ secrets.AOEDE_ANDROID_KEYSTORE_BASE64 }}
          AOEDE_ANDROID_STORE_PASSWORD: ${{ secrets.AOEDE_ANDROID_STORE_PASSWORD }}
          AOEDE_ANDROID_KEY_ALIAS: ${{ secrets.AOEDE_ANDROID_KEY_ALIAS }}
          AOEDE_ANDROID_KEY_PASSWORD: ${{ secrets.AOEDE_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$AOEDE_ANDROID_KEYSTORE_BASE64" ]; then
            export AOEDE_ANDROID_KEYSTORE="$RUNNER_TEMP/aoede-signing.p12"
            printf '%s' "$AOEDE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$AOEDE_ANDROID_KEYSTORE"
            chmod 600 "$AOEDE_ANDROID_KEYSTORE"
            trap 'rm -f "$AOEDE_ANDROID_KEYSTORE"' EXIT
            (cd android && ./gradlew --no-daemon assembleRelease)
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'Built an unsigned APK. Publishing requires the distribution signing key.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Package APK and complete source
        run: python3 scripts/package_android.py
      - name: Verify the release APK manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/dist/*.apk > "$RUNNER_TEMP/android-badging.txt"
          cat "$RUNNER_TEMP/android-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/android-badging.txt"; then exit 1; fi
          grep -q '^package: name='"'com.aoede.twa'" "$RUNNER_TEMP/android-badging.txt"
      - name: Verify installation compatibility with the existing release
        if: steps.signing.outputs.signed == 'true' && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AOEDE_REPOSITORY: ${{ github.repository }}
        run: |
          # The target may be a draft invisible to this read-only job. Compare
          # against the latest public APK that users can currently install.
          gh release download --pattern aoede-android.apk --dir "$RUNNER_TEMP/current-android" --repo "$AOEDE_REPOSITORY"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/current-android/aoede-android.apk" > "$RUNNER_TEMP/old-certificate.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/dist/aoede-android.apk > "$RUNNER_TEMP/new-certificate.txt"
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/old-certificate.txt" > "$RUNNER_TEMP/old-digest.txt"
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-certificate.txt" > "$RUNNER_TEMP/new-digest.txt"
          test -s "$RUNNER_TEMP/new-digest.txt"
          cmp "$RUNNER_TEMP/old-digest.txt" "$RUNNER_TEMP/new-digest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: aoede-android
          path: android/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.*

  publish:
    needs: build
    if: needs.build.outputs.signed == 'true' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aoede-android
          path: artifacts
      - name: Preserve the original remote-wrapper backup
        env:
          GH_TOKEN: ${{ github.token }}
          AOEDE_REPOSITORY: ${{ github.repository }}
          AOEDE_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release download "$AOEDE_RELEASE_TAG" --repo "$AOEDE_REPOSITORY" --dir wrapper-backup --clobber \
            --pattern aoede-android-wrapper-1.0.5.apk --pattern aoede-android-wrapper-1.0.5-source.zip; then
            backup_tag=$(gh api "repos/$AOEDE_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and any(.assets[]; .name == "aoede-android-wrapper-1.0.5.apk") and any(.assets[]; .name == "aoede-android-wrapper-1.0.5-source.zip"))][0].tag_name // empty')
            test -n "$backup_tag" || { echo "Original wrapper backup assets are unavailable." >&2; exit 1; }
            gh release download "$backup_tag" --repo "$AOEDE_REPOSITORY" --dir wrapper-backup --clobber \
              --pattern aoede-android-wrapper-1.0.5.apk --pattern aoede-android-wrapper-1.0.5-source.zip
          fi
          sha256sum --check <<'CHECKSUMS'
          9cc715cddf454ec662f87edc2c57f3aa61e44ba6e6b991d780fb2e7cc350fdda  wrapper-backup/aoede-android-wrapper-1.0.5.apk
          6f5364f9b93a4785645e90d54d7be598c6ef3b9666308e38e5242ec0566d34df  wrapper-backup/aoede-android-wrapper-1.0.5-source.zip
          CHECKSUMS
      - name: Update Android assets in the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          AOEDE_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          AOEDE_REPOSITORY: ${{ github.repository }}
        run: |
          gh release view "$AOEDE_RELEASE_TAG" --repo "$AOEDE_REPOSITORY"
          label=$(cat artifacts/android-version.txt)
          gh release upload "$AOEDE_RELEASE_TAG" "artifacts/aoede-android.apk#$label" artifacts/aoede-android-source.zip wrapper-backup/*.apk wrapper-backup/*.zip --clobber --repo "$AOEDE_REPOSITORY"
