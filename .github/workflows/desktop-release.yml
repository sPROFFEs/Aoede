name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to update (empty builds only)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Desktop Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packaging dependency
        run: python -m pip install Pillow==13.0.0

      - name: Install Neutralinojs CLI
        run: sudo npm install -g @neutralinojs/neu@11.7.2

      - name: Build Neutralino App
        working-directory: desktop
        run: |
          neu build --release

      - name: Package Release Archives
        run: python scripts/package_desktop.py

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: desktop/dist/releases/

      - name: Upload artifacts with the actual client version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          AOEDE_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          AOEDE_REPOSITORY: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("desktop/neutralino.config.json"))["version"])')
          gh release view "$AOEDE_RELEASE_TAG" --repo "$AOEDE_REPOSITORY"
          for archive in desktop/dist/releases/*.tar.gz; do
            gh release upload "$AOEDE_RELEASE_TAG" "$archive#Aoede Desktop $version" --clobber --repo "$AOEDE_REPOSITORY"
          done
