name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Desktop Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Neutralinojs CLI
        run: sudo npm install -g @neutralinojs/neu

      - name: Build Neutralino App
        working-directory: desktop
        run: |
          neu build --release

      - name: Package Release Archives
        working-directory: desktop/dist/aoede
        run: |
          mkdir -p ../../artifacts

          # Linux x64
          tar -czf ../../artifacts/aoede-linux-x64.tar.gz aoede-linux_x64 resources.neu
          # Linux ARM64
          tar -czf ../../artifacts/aoede-linux-arm64.tar.gz aoede-linux_arm64 resources.neu
          # macOS Universal
          tar -czf ../../artifacts/aoede-mac-universal.tar.gz aoede-mac_universal resources.neu
          # Windows x64
          tar -czf ../../artifacts/aoede-win-x64.tar.gz aoede-win_x64.exe resources.neu

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/artifacts/aoede-linux-x64.tar.gz
            desktop/artifacts/aoede-linux-arm64.tar.gz
            desktop/artifacts/aoede-mac-universal.tar.gz
            desktop/artifacts/aoede-win-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
