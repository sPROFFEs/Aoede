name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Desktop Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packaging dependency
        run: python -m pip install Pillow==12.3.0

      - name: Install Neutralinojs CLI
        run: sudo npm install -g @neutralinojs/neu@11.7.2

      - name: Build Neutralino App
        working-directory: desktop
        run: |
          neu build --release

      - name: Package Release Archives
        run: python scripts/package_desktop.py

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: desktop/dist/releases/

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/dist/releases/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
